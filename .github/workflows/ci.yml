name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate shared twins
        run: node scripts/build-dataclasses.js

      - name: Run test suite
        run: npm test

      - name: Build the update package
        run: node scripts/build-package.js

      - name: Smoke-load the installer modules
        run: node -e "require('./ccu-update.js'); require('./desktop-injector.js'); console.log('modules load')"
