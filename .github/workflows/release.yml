name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the draft release (e.g. v1.7.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Check release version
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest_electron.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "::error::Release tag must match the desktop manifest version."
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build update and graphical migration installers
        run: |
          node scripts/build-package.js
          bash scripts/build-migration-installers.sh

      - name: Verify release artifacts
        run: |
          node scripts/make-manifest.js \
            --version "${RELEASE_TAG#v}" \
            --package dist/ccu-extension.zip \
            --mac dist/Mac.installer.zip \
            --windows dist/windows.installer.zip \
            --out dist/latest.json
          node scripts/verify-release.js

      - name: Upload draft and verify GitHub asset digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ASSETS=(dist/latest.json dist/ccu-extension.zip dist/Mac.installer.zip dist/windows.installer.zip)
          RELEASE_JSON="$RUNNER_TEMP/ccu-release.json"
          read_release() {
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")" > "$RELEASE_JSON"
          }
          read_release
          if [[ -s "$RELEASE_JSON" ]]; then
            if [[ "$(jq -r .draft "$RELEASE_JSON")" != "true" ]]; then
              echo "::error::This release is already published."
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$(jq -r .target_commitish "$RELEASE_JSON")" != "$GITHUB_SHA" ]]; then
              echo "::error::The existing draft targets another revision."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            TAG_ARGS=(--target "$GITHUB_SHA")
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then TAG_ARGS=(--verify-tag); fi
            gh release create "$RELEASE_TAG" "${TAG_ARGS[@]}" --draft --generate-notes "${ASSETS[@]}"
          fi
          read_release
          node scripts/verify-release.js dist "$RELEASE_JSON"

      - name: Publish verified release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
