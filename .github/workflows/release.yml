name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.7.0)'
        required: true
        description: 'Draft version (leave blank to use the desktop manifest)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish update
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $MANIFEST"
          VERSION=$(node -p "require('./manifest_electron.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '::error::Desktop manifest version %q must use x.y.z.\n' "$VERSION"
            exit 1
          fi
          EXPECTED_TAG="v$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            REQUESTED_TAG=$(printf '%s' "$REQUESTED_TAG" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            RELEASE_TAG=${REQUESTED_TAG:-$EXPECTED_TAG}
            RELEASE_TAG="v${RELEASE_TAG#[vV]}"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            printf '::error::Release tag %q does not match the desktop manifest. Use %s for this revision.\n' "$RELEASE_TAG" "$EXPECTED_TAG"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Build automatic-update package
        run: node scripts/build-package.js

      - name: Build and package CLI launchers
        shell: bash
        run: |
          bash scripts/build-cli-launchers.sh
          mkdir -p dist
          zip -qry dist/Mac.installer.zip Install.app install.command
          zip -qj dist/windows.installer.zip Install.exe install.bat

      - name: Build latest.json
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node scripts/make-manifest.js \
            --version "$VERSION" \
            --package dist/ccu-extension.zip \
            --mac dist/Mac.installer.zip \
            --windows dist/windows.installer.zip \
            --notes "See the GitHub release notes for details." \
            --out dist/latest.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/latest.json
            dist/ccu-extension.zip
            dist/Mac.installer.zip
            dist/windows.installer.zip
